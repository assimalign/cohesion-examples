name: credential-guard
on: [push, pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # nuget.config names its feed credential by environment variable (value="%GITHUB_PASSWORD%"),
      # which carries no secret. Any other password value, and any GitHub token, fails the guard.
      - name: No credentials in tracked files
        run: |
          set -e
          exclude=':!.github/workflows/credential-guard.yml'
          tokens=$(git grep -nE 'ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' -- "$exclude" || true)
          passwords=$(git grep -nE 'ClearTextPassword|key="Password"' -- "$exclude" | grep -vE 'value="%[A-Za-z_][A-Za-z0-9_]*%"' || true)
          if [ -n "$tokens$passwords" ]; then
            printf '%s\n' "$tokens" "$passwords" | sed '/^$/d'
            echo "::error::credential material is committed; revoke it and remove it from the tree"; exit 1
          fi
