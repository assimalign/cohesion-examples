name: credential-guard
on: [push, pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No credentials in tracked files
        run: |
          set -e
          if git grep -nE 'packageSourceCredentials|ClearTextPassword|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' -- ':!.github/workflows/credential-guard.yml'; then
            echo "::error::credential material is committed; revoke it and remove it from the tree"; exit 1
          fi
