name: examples-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300

      - name: Verify generated solutions
        shell: pwsh
        run: ./setup.ps1 -Check

      - name: Select the release-feed Cohesion pins
        shell: pwsh
        run: |
          $releaseVersion = '10.0.1-preview.3'

          $globalPath = Join-Path $env:GITHUB_WORKSPACE 'global.json'
          $globalSettings = Get-Content -Raw -LiteralPath $globalPath | ConvertFrom-Json
          foreach ($sdkPin in $globalSettings.'msbuild-sdks'.PSObject.Properties) {
            $sdkPin.Value = $releaseVersion
          }
          $globalJson = $globalSettings | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText(
            $globalPath,
            $globalJson + [System.Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false))

          $nugetPath = Join-Path $env:GITHUB_WORKSPACE 'nuget.config'
          [xml] $nugetSettings = Get-Content -Raw -LiteralPath $nugetPath
          foreach ($xpath in @(
            "/configuration/packageSources/add[@key='cohesion-local']",
            "/configuration/packageSourceMapping/packageSource[@key='cohesion-local']",
            "/configuration/packageSources/add[@key='cohesion-platforms-local']",
            "/configuration/packageSourceMapping/packageSource[@key='cohesion-platforms-local']"
          )) {
            $node = $nugetSettings.SelectSingleNode($xpath)
            if ($null -ne $node) {
              [void] $node.ParentNode.RemoveChild($node)
            }
          }

          $xmlSettings = [System.Xml.XmlWriterSettings]::new()
          $xmlSettings.Indent = $true
          $xmlSettings.Encoding = [System.Text.UTF8Encoding]::new($false)
          $xmlWriter = [System.Xml.XmlWriter]::Create($nugetPath, $xmlSettings)
          try {
            $nugetSettings.Save($xmlWriter)
          }
          finally {
            $xmlWriter.Dispose()
          }

          if ((Get-Content -Raw -LiteralPath $globalPath) -match '\.local' -or
              $null -ne $nugetSettings.SelectSingleNode("/configuration/packageSources/add[@key='cohesion-local' or @key='cohesion-platforms-local']") -or
              $null -ne $nugetSettings.SelectSingleNode("/configuration/packageSourceMapping/packageSource[@key='cohesion-local' or @key='cohesion-platforms-local']")) {
            throw 'The CI restore must use released packages, not a developer-local feed.'
          }

      - name: Restore
        run: dotnet restore Assimalign.Cohesion.Examples.slnx --configfile nuget.config

      - name: Build
        run: dotnet build Assimalign.Cohesion.Examples.slnx --configuration Release --no-restore
