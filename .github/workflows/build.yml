name: examples-build

# Builds every example against the Cohesion build global.json pins. Cohesion's ci-packages.yml
# publishes each main commit (10.0.0-preview.0.ci.<run>) and same-repository pull request commit
# (10.0.0-preview.0.pr.<pr>.<run>) to the Assimalign GitHub Packages feed, which nuget.config maps
# Assimalign.Cohesion.* to. Moving the pin moves every example to that build. The prune workflow
# keeps the newest 20 main builds, so a pin older than that stops restoring. The application-model job
# builds each examples/libraries/ApplicationModel example against its own pins and runs it in process.
#
# Every `uses:` is pinned to a commit SHA with a trailing version comment, matching cohesion.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    runs-on: ubuntu-24.04
    # No run of this job has been measured yet; 45 minutes is the floor cohesion uses for jobs that
    # restore and build packaged consumers. Resize from the first successful runs.
    timeout-minutes: 45
    env:
      # GitHub Packages needs a token even to read public packages. NuGet reads source credentials
      # from NuGetPackageSourceCredentials_<source key>, so nothing is written into nuget.config.
      # COHESION_PACKAGES_TOKEN (a classic personal access token with read:packages) wins when the
      # repository defines it; otherwise the workflow's own token is used.
      NuGetPackageSourceCredentials_assimalign: Username=${{ github.actor }};Password=${{ secrets.COHESION_PACKAGES_TOKEN || github.token }}
      # nuget.config also names the credential through these two variables.
      GITHUB_USERNAME: ${{ github.actor }}
      GITHUB_PASSWORD: ${{ secrets.COHESION_PACKAGES_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify generated solutions
        shell: pwsh
        run: ./setup.ps1 -Check

      - name: Restore
        run: dotnet restore Assimalign.Cohesion.Examples.slnx --configfile nuget.config

      - name: Build
        run: dotnet build Assimalign.Cohesion.Examples.slnx --configuration Release --no-restore

      # Runs the test projects only: the Web.Testing examples.
      - name: Test
        run: dotnet test Assimalign.Cohesion.Examples.slnx --configuration Release --no-build

  # The ApplicationModel examples pin their own cohesion and cohesion-platforms CI builds (each folder's
  # global.json and Directory.Build.props) and keep their own solutions, so the root solution cannot
  # build them. This job restores and builds each against its pins, then runs it in process, which
  # needs no engine or cluster. Running one on its platform does, which each example's README describes.
  application-model:
    runs-on: ubuntu-24.04
    # Three small projects per example; resize from the first successful runs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example: [web-on-docker, web-on-kubernetes]
    defaults:
      run:
        working-directory: examples/libraries/ApplicationModel/${{ matrix.example }}
    env:
      NuGetPackageSourceCredentials_assimalign: Username=${{ github.actor }};Password=${{ secrets.COHESION_PACKAGES_TOKEN || github.token }}
      # nuget.config also names the credential through these two variables.
      GITHUB_USERNAME: ${{ github.actor }}
      GITHUB_PASSWORD: ${{ secrets.COHESION_PACKAGES_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: examples/libraries/ApplicationModel/${{ matrix.example }}/global.json

      - name: Restore
        run: dotnet restore Shop.slnx --configfile ../../../../nuget.config

      - name: Build
        run: dotnet build Shop.slnx --configuration Release --no-restore

      # Runs the shop as `dotnet run --project Shop.Gateway -- --in-process` does, from the Release build,
      # and proves the storefront answers through orders-api: it starts the gateway's executable, reads
      # the storefront's address from the gateway's "Try: curl" line, requests it until it answers, then
      # sends SIGINT, as Ctrl+C does, and expects a clean exit. The gateway's output is printed either way.
      - name: Run in process
        shell: pwsh
        timeout-minutes: 5
        run: |
          $targetPath = dotnet msbuild Shop.Gateway/Shop.Gateway.csproj -getProperty:TargetPath -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { throw "Reading the gateway's build output path failed (exit $LASTEXITCODE)." }
          $targetPath = (@($targetPath) | Where-Object { $_.Trim() } | Select-Object -Last 1).Trim()
          # The apphost is the assembly's path without its extension, plus .exe on Windows.
          $apphost = Join-Path ([System.IO.Path]::GetDirectoryName($targetPath)) ([System.IO.Path]::GetFileNameWithoutExtension($targetPath))
          if ($IsWindows) { $apphost += '.exe' }
          if (-not (Test-Path $apphost -PathType Leaf)) { throw "The gateway's executable is not at $apphost." }
          $gateway = $null
          $errors = $null
          $rest = $null
          $failure = $null
          $output = [System.Collections.Generic.List[string]]::new()
          try {
            $start = [System.Diagnostics.ProcessStartInfo]::new($apphost, '--in-process')
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $gateway = [System.Diagnostics.Process]::Start($start)
            $errors = $gateway.StandardError.ReadToEndAsync()

            # The gateway prints the storefront's address once every resource has published.
            $deadline = [DateTime]::UtcNow.AddMinutes(2)
            $storefront = $null
            while (-not $storefront) {
              $line = $gateway.StandardOutput.ReadLineAsync()
              if (-not $line.Wait([int][Math]::Max(0, ($deadline - [DateTime]::UtcNow).TotalMilliseconds))) {
                throw 'The gateway printed no storefront address within 2 minutes.'
              }
              if ($null -eq $line.Result) { throw "The gateway's output ended before it printed the storefront's address." }
              $output.Add($line.Result)
              if ($line.Result -match '^Try: curl (\S+)') { $storefront = $Matches[1] }
            }
            $rest = $gateway.StandardOutput.ReadToEndAsync()

            # An instance publishes before its server listens, so the first requests can arrive early.
            # One deadline bounds every attempt, so the script's own limits (2 min + about 65 s + 30 s)
            # stay under the step's timeout and the finally below always prints the gateway's output.
            $client = [System.Net.Http.HttpClient]::new()
            $client.Timeout = [TimeSpan]::FromSeconds(5)
            $requestDeadline = [DateTime]::UtcNow.AddSeconds(60)
            $answer = $null
            while (-not $answer) {
              try { $answer = $client.GetStringAsync($storefront).GetAwaiter().GetResult() }
              catch {
                if ([DateTime]::UtcNow -ge $requestDeadline) { throw "The storefront at $storefront did not answer within 60 seconds: $($_.Exception.Message)" }
                Start-Sleep -Seconds 1
              }
            }
            Write-Host "GET $storefront -> $answer"
            if ($answer -notmatch '-> orders-api: \{.*"orders"') { throw "The storefront's answer carries no data from orders-api." }

            /bin/kill -INT $gateway.Id
            if (-not $gateway.WaitForExit(30000)) { throw 'The gateway did not stop within 30 seconds of SIGINT.' }
            if ($gateway.ExitCode -ne 0) { throw "The gateway exited with $($gateway.ExitCode) after SIGINT." }
          }
          catch { $failure = $_ }
          finally {
            if ($gateway -and -not $gateway.HasExited) { $gateway.Kill($true); $gateway.WaitForExit() }
            if ($rest) { $output.AddRange([string[]]($rest.Result -split '\r?\n')) }
            Write-Host '--- gateway stdout ---'
            $output | ForEach-Object { Write-Host $_ }
            Write-Host '--- gateway stderr ---'
            if ($errors) { Write-Host $errors.Result }
          }
          if ($failure) { throw $failure }
